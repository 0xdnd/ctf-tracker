<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZEROBOX // Routing Vector...</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />
    <script>
      (function() {
        var path = location.pathname.replace(/^\/ctf-tracker\/?/, '');
        if (path.startsWith('docs/')) {
          path = path.replace(/^docs\/?/, '');
        }
        var hash = location.hash || (path ? ('#/' + path) : '');
        location.replace('/ctf-tracker/' + hash);
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0B0F19;
        color: #E2E8F0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .beacon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(6, 182, 212, 0.1);
        border: 1px solid rgba(6, 182, 212, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 0 24px rgba(6, 182, 212, 0.2);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .ring {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06B6D4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .badge {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #06B6D4;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .status {
        font-size: 13px;
        color: #94A3B8;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="beacon">
      <div class="ring"></div>
    </div>
    <div class="badge">ZEROBOX // TELEMETRY GATEWAY</div>
    <div class="status">RESOLVING SECURE VECTOR &bull; REDIRECTING...</div>
  </body>
</html>
