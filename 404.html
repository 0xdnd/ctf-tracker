<html lang="en">

    <title>ZEROBOX // Redirecting...</title>
    <script>
      (function() {
        var path = location.pathname.replace(/^\/ctf-tracker\/?/, '');
        if (path.startsWith('docs/')) {
          path = path.replace(/^docs\/?/, '');
        }
        var hash = location.hash || (path ? ('#/' + path) : '');
        location.replace('/ctf-tracker/' + hash);
      })();
