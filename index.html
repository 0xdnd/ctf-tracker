    <script>
      // Legacy hash URLs (#/tracker) -> clean URLs (/tracker). Web only; Tauri keeps hash routing.
      (function () {
        var l = window.location;
        if (l.protocol !== 'http:' && l.protocol !== 'https:') return;
        if (l.hostname === 'tauri.localhost' || window.__TAURI_INTERNALS__ || window.__TAURI__) return;
        if (l.hash.indexOf('#/') !== 0) return;
        var rest = l.hash.slice(2);
        var q = rest.indexOf('?');
        var path = q === -1 ? rest : rest.slice(0, q);
        var hq = q === -1 ? '' : rest.slice(q + 1);
        var query = [l.search.replace(/^\?/, ''), hq].filter(Boolean).join('&');
        history.replaceState(null, '', '/' + path + (query ? '?' + query : ''));
      })();
    </script>
