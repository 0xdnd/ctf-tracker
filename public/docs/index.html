<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ZeroBox redirecting</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Legacy ZeroBox docs address. Redirects to the ZeroBox tracker.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
    <script>
      var h = window.location.hash;
      var target = h.indexOf('#/') === 0 ? h.slice(1) : '/tracker/';
      window.location.replace(target + (h.indexOf('#/') === 0 ? '' : window.location.search));
    </script>
  </head>
  <body style="background-color: #09090b; color: #a1a1aa; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to ZeroBox tracker...</p>
  </body>
</html>
