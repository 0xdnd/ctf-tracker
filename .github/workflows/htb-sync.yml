# Requirements:
#  - Secret HTB_TOKEN must exist (an HTB App Token from app.hackthebox.com account settings).
# This workflow commits directly to main (no PR) when src/data/activeMachines.json changed and
# tests passed, then dispatches deploy.yml, because pushes made with GITHUB_TOKEN do not
# trigger other workflows.
name: HTB active machines sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: htb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check HTB_TOKEN
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          if [ -z "$HTB_TOKEN" ]; then
            echo "::error::HTB_TOKEN is empty. Add the repo secret HTB_TOKEN (an HTB App Token from app.hackthebox.com account settings)."
            exit 1
          fi
      - name: Sync active machines
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          set -o pipefail
          node scripts/sync-htb-active.mjs | tee /tmp/sync-summary.txt
      - name: Job summary
        run: |
          {
            echo '### HTB active machines sync'
            echo
            echo '~~~~'
            tr -d '`' < /tmp/sync-summary.txt
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install and test
        run: |
          if git diff --quiet -- src/data/activeMachines.json; then
            echo "No changes; skipping."
            exit 0
          fi
          npm ci
          npm test
      - name: Commit to main and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/activeMachines.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/activeMachines.json
          git commit -m "chore(data): sync active HTB machines $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
