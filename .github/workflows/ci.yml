name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (warning ceiling)
        run: npm run lint:ci

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Build (vite only)
        run: npx vite build

      - name: Check Bundle Size Budget
        run: node scripts/check-bundle-size.mjs

  desktop-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm ci

      # tauri's build script requires frontendDist (../dist) to exist.
      - name: Build Frontend (tauri mode)
        run: npm run build:tauri

      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo Clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

  static-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (full, generates static content pages)
        run: npm run build

      - name: Validate Static HTML
        run: npm run check:html

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility Scan of Static Pages (axe)
        run: npm run test:a11y:static
        env:
          CI: true

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-static
          path: playwright-report/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Suite
        run: npm run test:e2e:smoke
        env:
          E2E_PORT: 3200

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
