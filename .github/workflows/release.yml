name: Release ZeroBox Desktop (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v2.0.0)'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-flag: '--win'
          - os: ubuntu-latest
            target-flag: '--linux'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm run test

      - name: Build Web Application
        run: npm run build

      - name: Package Desktop Artifacts & Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.target-flag }} --publish always

      - name: Generate Checksums & Attach to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" && "${{ github.event.inputs.tag }}" != "manual" ]]; then
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          fi

          if [ -d "release" ]; then
            cd release
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              sha256sum *.exe > SHA256SUMS-windows.txt 2>/dev/null || true
              if [ -f "SHA256SUMS-windows.txt" ]; then
                gh release upload "$RELEASE_TAG" SHA256SUMS-windows.txt --clobber || true
              fi
            else
              sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt 2>/dev/null || true
              if [ -f "SHA256SUMS-linux.txt" ]; then
                gh release upload "$RELEASE_TAG" SHA256SUMS-linux.txt --clobber || true
              fi
            fi
          fi
