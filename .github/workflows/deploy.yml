name: Deploy ZeroBox to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npx vitest run

      - name: Verify Types & Build Static Bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        run: |
          node -e '
          (async () => {
            const origin = "https://ctftracker.com";
            const key = require("./src/seo/site.json").indexNowKey;
            const xml = require("fs").readFileSync("dist/sitemap.xml", "utf8");
            const urlList = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1].trim());
            if (!urlList.length) throw new Error("no urls in sitemap");
            const res = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "Content-Type": "application/json; charset=utf-8" },
              body: JSON.stringify({ host: "ctftracker.com", key, keyLocation: origin + "/" + key + ".txt", urlList }),
            });
            console.log("IndexNow submitted " + urlList.length + " URLs, status " + res.status);
          })().catch((e) => { console.error(e); process.exit(1); });
          '
