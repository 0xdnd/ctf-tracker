name: Deploy ZeroBox to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (warning ceiling)
        run: npm run lint:ci

      - name: Run Tests
        run: npx vitest run

      - name: Verify Types & Build Static Bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Snapshot Live Sitemap for IndexNow Diff
        continue-on-error: true
        run: curl -fsSL https://ctftracker.com/sitemap.xml -o live-sitemap.xml || true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.cjs --prev live-sitemap.xml
