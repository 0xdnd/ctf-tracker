[package]
name = "zerobox"
version = "2.5.5"
description = "ZeroBox: free, offline CTF tracker for Hack The Box and TryHackMe with loot, notes and OSCP/CPTS exam prep."
authors = ["Daniel Dayan (0xdnd)"]
license-file = "../LICENSE"
repository = "https://github.com/0xdnd/ctf-tracker"
homepage = "https://ctftracker.com"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "~2.13"
tauri-plugin-process = "~2.4"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

